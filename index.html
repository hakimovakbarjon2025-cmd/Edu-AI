<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAI — Учебный ИИ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: #172033;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 25px 10px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
        }

        .subtitle {
            color: #64748b;
            margin-top: 8px;
            font-size: 17px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 16px;
            margin: 7px 0;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #eef4ff;
            color: #172033;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #dce9ff;
        }

        .main-button {
            background: #3b82f6;
            color: white;
        }

        .main-button:hover {
            background: #2563eb;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            background: #f1f5f9;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .lesson {
            line-height: 1.7;
            font-size: 16px;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .option {
            text-align: left;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
        }

        .option:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
        }

        .wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        .score {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin: 20px 0;
        }

        .progress-box {
            margin: 15px 0;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .progress-bg {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 20px;
        }

        .input {
            width: 100%;
            padding: 15px;
            border: 2px solid #dbe2ea;
            border-radius: 14px;
            font-size: 17px;
            outline: none;
            margin-bottom: 10px;
        }

        .input:focus {
            border-color: #3b82f6;
        }

        .small {
            color: #64748b;
            font-size: 14px;
        }

        .welcome {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .emoji {
            font-size: 28px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 12px;
            }

            .logo {
                font-size: 34px;
            }

            .button {
                font-size: 16px;
            }
        }
    </style>
</head>

        function chooseTest() {

            app.innerHTML = `

                <h2>📝 ВЫБОР ТЕСТА</h2>

                <button class="button" onclick="startTest('Python')">

        `;

        var currentSubject = "";
        var currentQuestions = [];
        var currentQuestionIndex = 0;
        var currentScore = 0;

        function shuffleArray(array) {

            var copy = array.slice();

            for (var i = copy.length - 1; i > 0; i--) {

                var j = Math.floor(Math.random() * (i + 1));

                var temp = copy[i];

                copy[i] = copy[j];

                copy[j] = temp;
            }

            return copy;
        }

        function startTest(subject) {

            currentSubject = subject;

            currentQuestions = shuffleArray(questions[subject]);

            currentQuestionIndex = 0;

            currentScore = 0;

            showQuestion();
        }

        function showQuestion() {

            if (currentQuestionIndex >= currentQuestions.length) {

                showTestResult();

                return;
            }

            var q = currentQuestions[currentQuestionIndex];

            var html = "";

            html += '<div class="card">';

            html += '<h2>📝 Тест: ' + currentSubject + '</h2>';

            html += '<p class="small">';

            html += 'Вопрос ' + (currentQuestionIndex + 1);

            html += ' из ' + currentQuestions.length;

            html += '</p>';

            html += '<div class="question">';

            html += q.question;

            html += '</div>';

            for (var i = 0; i < q.options.length; i++) {

                html += '<button class="button option" onclick="answerQuestion(' + i + ')">';

                html += (i + 1) + '. ' + q.options[i];

                html += '</button>';
            }

            html += '<button class="button back" onclick="chooseTest()">';

            html += '⬅️ Выйти из теста';

            html += '</button>';

            html += '</div>';

            app.innerHTML = html;
        }

        function answerQuestion(answer) {

            var q = currentQuestions[currentQuestionIndex];

            if (answer === q.answer) {

                currentScore++;

                alert("✅ Правильно!");

            } else {
                alert(
                    "❌ Неправильно.\n\nПравильный ответ: " +
                    q.options[q.answer]
                );
            }

            currentQuestionIndex++;

            showQuestion();
        }

        function showTestResult() {

            var percentage =
                Math.round(
                    (currentScore / currentQuestions.length) * 100
                );

            progress[currentSubject] = percentage;

            saveProgress();

            var message = "";

            if (percentage === 100) {

                message = "🏆 Идеальный результат!";

            } else if (percentage >= 80) {

                message = "🔥 Отличный результат!";

            } else if (percentage >= 60) {

                message = "👍 Хороший результат!";

            } else {

                message = "📚 Нужно немного повторить тему.";
            }

            app.innerHTML = `
            <div class="card">

                <h2>🎉 Тест завершён!</h2>

                <div class="score">
                    ${percentage}%
                </div>

                <p style="text-align:center;">

                </p>

                    ${message}

                <button class="button main-button" onclick="startTest('${currentSubject}')">
                    🔄 Пройти ещё раз
                </button>

                    📝 Выбрать другой тест
                </button>

        `;

        function questionMode() {

        function askEduAI() {

            var input = document.getElementById("questionInput");
            var answerBox = document.getElementById("answerBox");

            var question = input.value.trim();

            var q = question.toLowerCase();

            var answer = "";

            if (q.includes("что такое python")) {
                (q.includes("что такое пайтон"))
                    (q.includes("что такое Пайтон"))
                    (q.includes("что такое Python"))
                answer = "🐍 Python — это язык программирования, который используют для создания программ, сайтов, игр и работы с данными.";
            }
            else if (q.includes("что такое цикл for")) {
                (q.includes("что такое цикл "))
                answer = "🔄 Цикл for позволяет повторять один и тот же блок кода несколько раз.";
            }
            else if (q.includes("что такое переменная")) {
                answer = "📦 Переменная — это имя, под которым программа хранит некоторое значение.";
            }
            else if (q.includes("что такое алгоритм")) {
                answer = "🧠 Алгоритм — это последовательность действий, которая приводит к решению задачи.";
            }
            else if (q.includes("что такое число")) {
                answer = "🔢 Число — это математический объект, который используется для счёта, измерения и выполнения вычислений.";
